<!doctype html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP Bootstrap 5 - 11 - Images responsives, vignettes et ratios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>
<body>
<main class="container py-4">
  <h2>Images responsive</h2>
  <div class="row g-4 align-items-center">
    <div class="col-md-6">
      <img src="../projet_final/assets/campus.svg" class="img-fluid rounded shadow-sm" alt="Illustration stylisée d’un campus universitaire">
    </div>
    <div class="col-md-6">
      <div class="ratio ratio-16x9 rounded overflow-hidden border">
        <img src="../projet_final/assets/campus.svg" alt="Campus dans un cadre seize sur neuf" style="width:100%;height:100%;object-fit:cover;">
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
</body>
</html>

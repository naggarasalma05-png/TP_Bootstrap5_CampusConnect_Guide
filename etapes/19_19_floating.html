<!doctype html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP Bootstrap 5 - 19 - Floating labels et champs complémentaires</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>
<body>
<main class="container py-4"><h2>Labels flottants</h2>
  <div class="form-floating mb-3"><input type="email" class="form-control" id="flMail" placeholder="nom@exemple.tn"><label for="flMail">Adresse e-mail</label></div>
  <div class="form-floating mb-3"><select class="form-select" id="flOption" aria-label="Choisir un atelier"><option>Web</option><option>Cloud</option><option>Data</option></select><label for="flOption">Atelier</label></div>
  <div class="form-floating"><textarea class="form-control" placeholder="Votre commentaire" id="flCommentaire" style="height:120px"></textarea><label for="flCommentaire">Commentaire</label></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
</body>
</html>

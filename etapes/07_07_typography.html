<!doctype html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP Bootstrap 5 - 07 - Titres, paragraphes et classes de texte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>
<body>
<main class="container py-4">
  <h1 class="display-5 fw-bold">CampusConnect</h1>
  <p class="lead">Un paragraphe d’introduction plus visible.</p>
  <h2>Un vrai sous-titre HTML</h2>
  <p class="h2">Ce paragraphe ressemble à un titre.</p>
  <p class="text-body-secondary">Texte secondaire pour une précision.</p>
  <p class="fw-bold fst-italic text-uppercase">Texte important et stylisé.</p>
  <p class="text-center">Texte centré par classe utilitaire.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
</body>
</html>

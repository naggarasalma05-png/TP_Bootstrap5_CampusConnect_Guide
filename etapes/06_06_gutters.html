<!doctype html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP Bootstrap 5 - 06 - Espacements de grille : g, gx et gy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>
<body>
<main class="container py-4">
  <h2>Gouttières de la grille</h2>
  <p>Avec <code>g-0</code></p>
  <div class="row g-0 mb-4">
    <div class="col-6"><div class="bg-primary text-white p-3">A</div></div>
    <div class="col-6"><div class="bg-info p-3">B</div></div>
  </div>
  <p>Avec <code>gx-4 gy-3</code></p>
  <div class="row gx-4 gy-3">
    <div class="col-6"><div class="bg-primary text-white p-3">A</div></div>
    <div class="col-6"><div class="bg-info p-3">B</div></div>
    <div class="col-6"><div class="bg-success text-white p-3">C</div></div>
    <div class="col-6"><div class="bg-warning p-3">D</div></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
</body>
</html>

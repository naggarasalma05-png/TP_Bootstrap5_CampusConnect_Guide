<!doctype html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP Bootstrap 5 - 21 - Fenêtre modale</title>
  <link rel="stylesheet" href="../vendor/bootstrap.min.css">
</head>
<body>
<main class="container py-4"><h2>Fenêtre modale</h2>
  <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#modalAtelier">Ouvrir la modale</button>
  <div class="modal fade" id="modalAtelier" tabindex="-1" aria-labelledby="titreModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h3 class="modal-title fs-5" id="titreModal">Inscription à un atelier</h3><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Fermer"></button></div>
      <div class="modal-body"><p>La fenêtre présente une information sans quitter la page.</p></div>
      <div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Fermer</button><button class="btn btn-primary" type="button" data-bs-dismiss="modal">Compris</button></div>
    </div></div>
  </div>
</main>
<script src="../vendor/bootstrap.bundle.min.js"></script>

</html>

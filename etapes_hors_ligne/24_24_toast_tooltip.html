<!doctype html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP Bootstrap 5 - 24 - Toast, tooltip et popover</title>
  <link rel="stylesheet" href="../vendor/bootstrap.min.css">
</head>
<body>
<main class="container py-4"><h2>Notifications et aides</h2>
  <div class="d-flex flex-wrap gap-2">
    <button id="afficherToast" class="btn btn-primary">Afficher le toast</button>
    <button class="btn btn-outline-secondary" data-bs-toggle="tooltip" data-bs-title="Une aide courte au survol ou au focus">Aide</button>
    <button class="btn btn-outline-info" data-bs-toggle="popover" data-bs-title="CampusConnect" data-bs-content="Vous pouvez retrouver les ateliers dans le menu principal.">En savoir plus</button>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toastDemo" class="toast" role="status" aria-live="polite" aria-atomic="true">
      <div class="toast-header"><strong class="me-auto">CampusConnect</strong><small>à l’instant</small><button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Fermer"></button></div>
      <div class="toast-body">Notification de démonstration affichée.</div>
    </div>
  </div>
</main>
<script src="../vendor/bootstrap.bundle.min.js"></script>
  <script>
document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));
document.querySelectorAll('[data-bs-toggle="popover"]').forEach(el => new bootstrap.Popover(el));
document.getElementById('afficherToast').addEventListener('click', () => {
  bootstrap.Toast.getOrCreateInstance(document.getElementById('toastDemo')).show();
});
  </script>
</body>
</html>

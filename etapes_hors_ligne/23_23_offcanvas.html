<!doctype html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP Bootstrap 5 - 23 - Panneau latéral Offcanvas</title>
  <link rel="stylesheet" href="../vendor/bootstrap.min.css">
</head>
<body>
<main class="container py-4"><h2>Panneau latéral</h2>
  <button class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#filtres" aria-controls="filtres">Ouvrir les filtres</button>
  <div class="offcanvas offcanvas-end" tabindex="-1" id="filtres" aria-labelledby="titreFiltres">
    <div class="offcanvas-header"><h3 class="offcanvas-title h5" id="titreFiltres">Choisir un atelier</h3><button class="btn-close" type="button" data-bs-dismiss="offcanvas" aria-label="Fermer"></button></div>
    <div class="offcanvas-body"><label for="choixAtelier" class="form-label">Atelier</label><select id="choixAtelier" class="form-select"><option>Web</option><option>Data</option><option>Cloud</option></select><button class="btn btn-success mt-3" data-bs-dismiss="offcanvas">Appliquer</button></div>
  </div>
</main>
<script src="../vendor/bootstrap.bundle.min.js"></script>
</body>
</html>
